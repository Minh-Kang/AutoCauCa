name: Build AutoCauCa APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android project
        run: unzip -q source-v0.2-jvm17-fixed.zip -d .
      - name: Build debug APK
        run: gradle -p AutoCauCa --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCauCa-debug-apk
          path: AutoCauCa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
